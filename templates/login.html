<!doctype html>
<html lang="zh-CN" class="h-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 · 校园安全智能监测平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/login-emotional.css') }}" rel="stylesheet">
  <style>
    .login-page--emotional {
      --login-photo: url("{{ url_for('static', filename='images/login-swirl-road.jpg') }}");
    }
  </style>
</head>
<body class="login-page login-page--emotional h-100">
  <div class="login-emo-layout">
    <aside class="login-emo-visual" aria-label="校园风景">
      <canvas class="login-vortex-canvas" id="loginVortexCanvas" aria-hidden="true"></canvas>
      <img
        class="login-vortex-source visually-hidden"
        id="loginPhotoSrc"
        src="{{ url_for('static', filename='images/login-swirl-road.jpg') }}"
        alt=""
        decoding="async"
      >

      <div class="login-emo-visual-fade" aria-hidden="true"></div>
      <p class="login-emo-tagline">校园安全智能监测平台</p>
    </aside>

    <main class="login-emo-form-panel">
      <div class="login-emo-form-inner{% if error %} is-error{% endif %}" id="loginFormInner">
        <h1 class="login-emo-welcome">校园安全智能监测平台</h1>
        <p class="login-emo-subtitle">Please enter your details</p>

        {% if error %}
          <div class="login-emo-alert" role="alert" id="loginErrorAlert">{{ error }}</div>
        {% endif %}

        <form method="post" class="login-emo-form" id="loginForm" novalidate>
          <div class="login-emo-field">
            <label class="login-emo-label" for="login-email">Email</label>
            <input
              class="login-emo-input"
              id="login-email"
              type="text"
              name="username"
              required
              autocomplete="username"
              placeholder="name@example.com 或账号"
              inputmode="email"
              enterkeyhint="next"
            >
          </div>
          <div class="login-emo-field">
            <label class="login-emo-label" for="login-password">Password</label>
            <div class="login-emo-password-wrap">
              <input
                class="login-emo-input login-emo-input--password"
                id="login-password"
                type="password"
                name="password"
                required
                autocomplete="current-password"
                placeholder="请输入密码"
                enterkeyhint="go"
              >
              <button type="button" class="login-emo-eye" id="login-password-toggle" aria-label="显示密码" aria-pressed="false">
                <svg class="login-emo-eye-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="login-emo-eye-off d-none" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="login-emo-row">
            <label class="login-emo-remember">
              <input type="checkbox" name="remember" id="login-remember" value="1">
              Remember for 30 days
            </label>
            <a href="#" class="login-emo-forgot" id="login-forgot">Forgot password?</a>
          </div>

          <button class="login-emo-submit" type="submit">Log In</button>
        </form>

        <p class="login-emo-signup">
          Don't have an account? <a href="#" id="login-signup">Sign Up</a>
        </p>

        <div class="login-emo-demo" aria-label="模拟测试账号">
          <p class="login-emo-demo-title">模拟账号（点击快速填入）</p>
          <div class="login-emo-demo-chips">
            <button type="button" class="login-emo-demo-chip" data-demo-user data-user="admin" data-pass="admin123">
              <span class="login-emo-demo-role">管理员</span>
              <span class="login-emo-demo-pair">admin / admin123</span>
            </button>
            <button type="button" class="login-emo-demo-chip" data-demo-user data-user="teacher01" data-pass="teacher123">
              <span class="login-emo-demo-role">教师</span>
              <span class="login-emo-demo-pair">teacher01 / teacher123</span>
            </button>
            <button type="button" class="login-emo-demo-chip" data-demo-user data-user="student01" data-pass="student123">
              <span class="login-emo-demo-role">学生</span>
              <span class="login-emo-demo-pair">student01 / student123</span>
            </button>
            <button type="button" class="login-emo-demo-chip" data-demo-user data-user="security01" data-pass="security123">
              <span class="login-emo-demo-role">安保</span>
              <span class="login-emo-demo-pair">security01 / security123</span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
(function () {
  var email = document.getElementById("login-email");
  var pwd = document.getElementById("login-password");
  var toggle = document.getElementById("login-password-toggle");
  var formInner = document.getElementById("loginFormInner");

  function isValidAccount(value) {
    var v = (value || "").trim();
    if (v.length < 3) return false;
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return true;
    return /^[a-zA-Z0-9_.-]{3,}$/.test(v);
  }

  function updateEmailVisual() {
    if (!email) return;
    var ok = isValidAccount(email.value);
    email.classList.toggle("is-valid", ok);
    email.classList.toggle("is-invalid", email.value.trim().length > 0 && !ok);
  }

  if (email) {
    email.addEventListener("blur", updateEmailVisual);
    email.addEventListener("input", function () {
      updateEmailVisual();
      if (formInner) formInner.classList.remove("is-error");
    });
  }

  if (pwd) {
    pwd.addEventListener("input", function () {
      if (formInner) formInner.classList.remove("is-error");
    });
  }

  if (toggle && pwd) {
    var iconOn = toggle.querySelector(".login-emo-eye-on");
    var iconOff = toggle.querySelector(".login-emo-eye-off");
    toggle.addEventListener("click", function () {
      var show = pwd.type === "password";
      pwd.type = show ? "text" : "password";
      toggle.setAttribute("aria-pressed", show ? "true" : "false");
      toggle.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
      if (iconOn && iconOff) {
        iconOn.classList.toggle("d-none", show);
        iconOff.classList.toggle("d-none", !show);
      }
    });
  }

  document.querySelectorAll("[data-demo-user]").forEach(function (demo) {
    demo.addEventListener("click", function () {
      if (!email || !pwd) return;
      email.value = demo.getAttribute("data-user") || "";
      pwd.value = demo.getAttribute("data-pass") || "";
      pwd.type = "password";
      updateEmailVisual();
      if (formInner) formInner.classList.remove("is-error");
      if (toggle) {
        toggle.setAttribute("aria-pressed", "false");
        toggle.setAttribute("aria-label", "显示密码");
        var iconOn = toggle.querySelector(".login-emo-eye-on");
        var iconOff = toggle.querySelector(".login-emo-eye-off");
        if (iconOn && iconOff) {
          iconOn.classList.remove("d-none");
          iconOff.classList.add("d-none");
        }
      }
    });
  });

  {% if error %}
  if (formInner) {
    formInner.classList.add("is-error");
  }
  {% endif %}

  document.getElementById("login-forgot")?.addEventListener("click", function (e) {
    e.preventDefault();
    alert("请联系系统管理员重置密码。");
  });
  document.getElementById("login-signup")?.addEventListener("click", function (e) {
    e.preventDefault();
    alert("本系统账号由管理员统一分配，如需开通请联系管理员。");
  });
})();
  </script>
  <script src="{{ url_for('static', filename='js/login-vortex.js') }}"></script>
</body>
</html>
