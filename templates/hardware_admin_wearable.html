{% extends "base.html" %}
{% block title %}可穿戴移动终端 · 学生列表{% endblock %}
{% block head_extra %}
<link href="{{ url_for('static', filename='css/hardware.css') }}" rel="stylesheet">
<style>
  .wearable-student-row { cursor: pointer; }
  .wearable-student-row:hover { background: #f7fbff; }
  .wearable-student-name-risk { color: #d4380d; font-weight: 700; }
</style>
{% endblock %}
{% block content %}
<div class="mb-3 d-flex flex-wrap gap-2 align-items-center">
  <a href="{{ url_for('hardware_dashboard') }}" class="btn btn-sm btn-outline-secondary rounded-pill">← 返回硬件监测主页</a>
  <span class="small text-muted">管理员 · 可穿戴移动终端学生列表</span>
</div>

<div class="card card-soft border-0 shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h5 fw-bold mb-0">学生监测列表</h2>
      <button type="button" id="wearableListRefreshBtn" class="btn btn-sm btn-outline-primary">刷新</button>
    </div>
    <p class="small text-muted mb-3">点击学生条目进入二级详情，查看该学生实时心率、蓝牙与 GPS 监测信息。</p>
    <div class="table-responsive border rounded-3 bg-white">
      <table class="table table-sm mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th class="ps-3">姓名</th>
            <th>学号</th>
            <th>状态摘要</th>
            <th class="pe-3 text-end">操作</th>
          </tr>
        </thead>
        <tbody id="wearableStudentListBody">
          <tr><td colspan="4" class="text-center text-muted py-4">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/hardware-admin-wearable.js') }}"></script>
{% endblock %}
