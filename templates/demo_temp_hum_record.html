{% extends "base.html" %}
{% block title %}温湿度监测 · 录屏{% endblock %}
{% block head_extra %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/hardware.css') }}" rel="stylesheet">
<style>
  .demo-th-page.demo-th-wrap {
    max-width: 960px;
    margin: 0 auto;
  }
  .demo-th-topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .demo-th-kpi .hw-kpi-value {
    transition: color 0.35s ease, text-shadow 0.35s ease;
  }
  .demo-th-kpi.is-pending .hw-kpi-value {
    color: #94a3b8;
    font-weight: 600;
  }
  .demo-th-kpi.is-live .hw-kpi-value {
    color: var(--hw-text, #1a3a3a);
    font-weight: 800;
  }
  .demo-th-kpi.is-live.temp-pop .hw-kpi-value {
    animation: demoThKpiPop 1.2s ease-out 1;
  }
  @keyframes demoThKpiPop {
    0%, 100% { text-shadow: none; }
    40% { text-shadow: 0 0 14px rgba(0, 212, 216, 0.35); }
  }
  #demoThChart {
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  #demoThChart.is-in {
    opacity: 1;
  }
  .demo-th-ai-wrap {
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.45s ease, max-height 0.55s ease;
  }
  .demo-th-ai-wrap.is-in {
    opacity: 1;
    max-height: 420px;
  }
</style>
{% endblock %}
{% block content %}
<div class="hw-page demo-th-page demo-th-wrap py-2 py-md-3">
  <div class="demo-th-topbar">
    <h1 class="h5 fw-bold mb-0 text-monitor-title">温湿度监测</h1>
    <button type="button" class="btn btn-sm hw-btn-primary text-nowrap rounded-3" id="demoThReplay">刷新</button>
  </div>
  <div class="row g-3">
    <div class="col-12">
      <article class="hw-card hw-card--wide monitor-card border-0 shadow-sm" id="demoCardTempHum">
        <div class="hw-card-head">
          <span class="hw-card-icon" aria-hidden="true">🌡️</span>
          <div>
            <h4 class="hw-card-title">温湿度</h4>
            <p class="hw-card-meta mb-0" id="demoMetaTempHum">—</p>
          </div>
        </div>
        <div class="hw-kpi-row">
          <div class="hw-kpi demo-th-kpi is-pending" id="demoKpiTemp">
            <span class="hw-kpi-label">温度</span>
            <span class="hw-kpi-value" id="demoValTemp">—</span>
            <span class="hw-kpi-unit">℃</span>
          </div>
          <div class="hw-kpi demo-th-kpi is-pending" id="demoKpiHum">
            <span class="hw-kpi-label">湿度</span>
            <span class="hw-kpi-value" id="demoValHum">—</span>
            <span class="hw-kpi-unit">%</span>
          </div>
        </div>
        <div class="hw-chart" id="demoThChart" role="img" aria-label="温湿度趋势"></div>
        <div class="demo-th-ai-wrap mt-2 pt-3 border-top" id="demoThAiWrap" aria-live="polite">
          <div class="d-flex align-items-start gap-2 mb-2">
            <span class="hw-card-icon" aria-hidden="true" style="font-size: 1.25rem;">🤖</span>
            <div>
              <h4 class="h6 fw-bold mb-1">AI 分析</h4>
              <p class="small text-muted mb-2" id="demoThAiLead">—</p>
              <ul class="small mb-0 ps-3" id="demoThAiList"></ul>
            </div>
          </div>
        </div>
      </article>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  const METRIC_MS = 560;
  const CHART_DELAY_MS = 420;
  const AI_AFTER_CHART_MS = 480;
  const COL = {
    cyan: "#00d4d8",
    cyanLight: "#4ecdc4",
    red: "#e63946",
    text: "#5c7a7a",
    split: "#e0f2f0",
  };

  /** 与硬件监测页视觉一致的静态样本序列（可重复录屏） */
  const DATA = {
    updatedLabel: "2026-05-05 14:32",
    thresholdTempMed: 37.5,
    thresholdHumMed: 80,
    temperature: 26.8,
    humidity: 58,
    temp_anomaly: false,
    humidity_anomaly: false,
    aiLead:
      "当前温度与湿度联动曲线平稳，未触及告警阈值，整体处于适宜开展教学与人员密集活动的环境窗口。",
    aiBullets: [
      "温度变化节律正常，可维持现有空调与新风巡检周期",
      "湿度未见异常抬升；换季或梅雨时段建议对照室外气象加密采样",
      "若后续单侧指标冲高，可结合本时段曲线回溯是否为短时事件",
    ],
    series: [
      { t: "2026-05-04T17:00:00", temp: 22.1, hum: 54 },
      { t: "2026-05-04T18:00:00", temp: 22.4, hum: 55 },
      { t: "2026-05-04T19:00:00", temp: 22.8, hum: 56 },
      { t: "2026-05-04T20:00:00", temp: 23.2, hum: 57 },
      { t: "2026-05-04T21:00:00", temp: 23.5, hum: 58 },
      { t: "2026-05-04T22:00:00", temp: 23.8, hum: 59 },
      { t: "2026-05-04T23:00:00", temp: 24.0, hum: 60 },
      { t: "2026-05-05T00:00:00", temp: 24.2, hum: 61 },
      { t: "2026-05-05T01:00:00", temp: 24.4, hum: 60 },
      { t: "2026-05-05T02:00:00", temp: 24.6, hum: 59 },
      { t: "2026-05-05T03:00:00", temp: 24.9, hum: 58 },
      { t: "2026-05-05T04:00:00", temp: 25.2, hum: 57 },
      { t: "2026-05-05T05:00:00", temp: 25.6, hum: 56 },
      { t: "2026-05-05T06:00:00", temp: 26.0, hum: 56 },
      { t: "2026-05-05T07:00:00", temp: 26.3, hum: 57 },
      { t: "2026-05-05T08:00:00", temp: 26.5, hum: 57 },
      { t: "2026-05-05T09:00:00", temp: 26.6, hum: 58 },
      { t: "2026-05-05T10:00:00", temp: 26.7, hum: 58 },
      { t: "2026-05-05T11:00:00", temp: 26.8, hum: 58 },
      { t: "2026-05-05T12:00:00", temp: 26.9, hum: 59 },
      { t: "2026-05-05T13:00:00", temp: 26.8, hum: 58 },
      { t: "2026-05-05T14:00:00", temp: 26.8, hum: 58 },
      { t: "2026-05-05T15:00:00", temp: 26.8, hum: 58 },
    ],
  };

  let chart;

  function sleep(ms) {
    return new Promise(function (r) {
      setTimeout(r, ms);
    });
  }

  function el(id) {
    return document.getElementById(id);
  }

  function reset() {
    var meta = el("demoMetaTempHum");
    if (meta) {
      meta.textContent = "—";
      meta.classList.remove("text-body");
    }
    ["demoKpiTemp", "demoKpiHum"].forEach(function (id) {
      var k = el(id);
      if (!k) return;
      k.classList.add("is-pending");
      k.classList.remove("is-live", "temp-pop");
    });
    var vt = el("demoValTemp");
    var vh = el("demoValHum");
    if (vt) vt.textContent = "—";
    if (vh) vh.textContent = "—";
    var card = el("demoCardTempHum");
    if (card) {
      card.classList.remove("card-low-risk", "card-medium-risk", "card-high-risk", "low-risk", "medium-risk", "high-risk");
    }
    var chEl = el("demoThChart");
    if (chEl) {
      chEl.classList.remove("is-in");
    }
    var ai = el("demoThAiWrap");
    if (ai) {
      ai.classList.remove("is-in");
      ai.style.removeProperty("max-height");
    }
    var lead = el("demoThAiLead");
    var list = el("demoThAiList");
    if (lead) lead.textContent = "—";
    if (list) list.innerHTML = "";
    if (chart) {
      chart.dispose();
      chart = null;
    }
  }

  function renderChart() {
    var th = DATA.series || [];
    var times = th.map(function (r) {
      return r.t;
    });
    var temps = th.map(function (r) {
      return r.temp;
    });
    var hums = th.map(function (r) {
      return r.hum;
    });
    var tempLineColor = DATA.temp_anomaly ? COL.red : COL.cyan;
    var cEl = el("demoThChart");
    if (!cEl || typeof echarts === "undefined") return;
    chart = echarts.init(cEl);
    chart.setOption({
      color: [COL.cyan, COL.cyanLight],
      animationDuration: 1100,
      animationEasing: "cubicOut",
      tooltip: { trigger: "axis" },
      legend: { data: ["温度℃", "湿度%"], textStyle: { color: COL.text } },
      grid: { left: "3%", right: "4%", bottom: "3%", top: "18%", containLabel: true },
      xAxis: {
        type: "category",
        data: times.map(function (t) {
          return t ? t.slice(5, 16).replace("T", " ") : "";
        }),
        axisLabel: { color: COL.text, fontSize: 10 },
        splitLine: { show: false },
      },
      yAxis: [
        {
          type: "value",
          name: "℃",
          axisLabel: { color: COL.text },
          splitLine: { lineStyle: { color: COL.split } },
        },
        {
          type: "value",
          name: "%",
          axisLabel: { color: COL.text },
          splitLine: { show: false },
        },
      ],
      series: [
        {
          name: "温度℃",
          type: "line",
          smooth: true,
          data: temps,
          lineStyle: { width: 3, color: tempLineColor },
          symbol: "circle",
          symbolSize: 6,
        },
        {
          name: "湿度%",
          type: "line",
          yAxisIndex: 1,
          smooth: true,
          data: hums,
          lineStyle: { width: 2, type: "dashed", color: COL.cyanLight },
          symbol: "circle",
          symbolSize: 5,
        },
      ],
    });
    requestAnimationFrame(function () {
      if (cEl) cEl.classList.add("is-in");
    });
  }

  function showAiPanel() {
    var wrap = el("demoThAiWrap");
    var lead = el("demoThAiLead");
    var list = el("demoThAiList");
    if (!wrap || !lead || !list) return;
    lead.textContent = DATA.aiLead || "—";
    list.innerHTML = "";
    (DATA.aiBullets || []).forEach(function (text) {
      var li = document.createElement("li");
      li.textContent = text;
      li.className = "mb-1";
      list.appendChild(li);
    });
    requestAnimationFrame(function () {
      wrap.classList.add("is-in");
    });
  }

  async function run() {
    reset();
    await sleep(280);
    var meta = el("demoMetaTempHum");
    if (meta) {
      meta.textContent =
        "阈值参考 温度≥" +
        DATA.thresholdTempMed +
        "℃ 湿度≥" +
        DATA.thresholdHumMed +
        "% · 更新：" +
        DATA.updatedLabel;
    }
    await sleep(METRIC_MS);
    var vt = el("demoValTemp");
    var kt = el("demoKpiTemp");
    if (vt) vt.textContent = Number(DATA.temperature).toFixed(1);
    if (kt) {
      kt.classList.remove("is-pending");
      kt.classList.add("is-live", "temp-pop");
    }
    await sleep(METRIC_MS);
    var vh = el("demoValHum");
    var kh = el("demoKpiHum");
    if (vh) vh.textContent = String(Math.round(Number(DATA.humidity)));
    if (kh) {
      kh.classList.remove("is-pending");
      kh.classList.add("is-live");
    }
    var card = el("demoCardTempHum");
    if (card && (DATA.temp_anomaly || DATA.humidity_anomaly)) {
      card.classList.add("card-low-risk");
    }
    if (kt) {
      kt.classList.toggle("is-anomaly", !!DATA.temp_anomaly);
    }
    if (kh) {
      kh.classList.toggle("is-anomaly", !!DATA.humidity_anomaly);
    }
    await sleep(CHART_DELAY_MS);
    renderChart();
    await sleep(AI_AFTER_CHART_MS);
    showAiPanel();
  }

  var btn = el("demoThReplay");
  if (btn) btn.addEventListener("click", function () {
    run().catch(function () {});
  });

  window.addEventListener("resize", function () {
    if (chart) chart.resize();
  });

  setTimeout(function () {
    run().catch(function () {});
  }, 600);
})();
</script>
{% endblock %}
