{% extends "base.html" %}
{% block content %}
<div class="events-page-head mb-3 mb-md-4">
  <h1 class="h4 fw-bold text-events-title mb-1">事件记录 - 历史数据归档</h1>
  <p class="text-muted small mb-0">事件档案库（只读）：支持全量检索、分页归档、导出 CSV 与详情追溯</p>
</div>

<div class="card card-soft border-0 shadow-sm mb-3 mb-md-4">
  <div class="card-body p-3 p-md-4">
    <div class="row g-2 events-filter-row">
      <div class="col-12 col-sm-6 col-md-4 col-lg-2">
        <label class="form-label small text-muted mb-1 d-none d-md-block">地点</label>
        <input id="f-location" class="form-control rounded-3 app-form-touch" placeholder="地点关键词">
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-2">
        <label class="form-label small text-muted mb-1 d-none d-md-block">事件类型</label>
        <select id="f-type" class="form-select rounded-3 app-form-touch">
          <option value="">全部类型</option>
          <option value="violence">暴力</option>
          <option value="bullying">欺凌</option>
          <option value="crowd">聚集</option>
          <option value="abnormal">异常行为</option>
          <option value="follow">尾随风险</option>
          <option value="normal">常规</option>
        </select>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-2">
        <label class="form-label small text-muted mb-1 d-none d-md-block">风险等级</label>
        <select id="f-risk" class="form-select rounded-3 app-form-touch">
          <option value="">全部等级</option>
          <option value="high">高</option>
          <option value="medium">中</option>
          <option value="low">低</option>
        </select>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-2">
        <label class="form-label small text-muted mb-1 d-none d-md-block">处理状态</label>
        <select id="f-status" class="form-select rounded-3 app-form-touch">
          <option value="">全部状态</option>
          <option value="open">待处理</option>
          <option value="closed" selected>已处理</option>
        </select>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-2">
        <label class="form-label small text-muted mb-1 d-none d-md-block">开始时间</label>
        <input id="f-start" class="form-control rounded-3 app-form-touch" placeholder="如 2025-01-01">
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-2">
        <label class="form-label small text-muted mb-1 d-none d-md-block">结束时间</label>
        <input id="f-end" class="form-control rounded-3 app-form-touch" placeholder="如 2025-12-31">
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-2">
        <label class="form-label small text-muted mb-1 d-none d-md-block">每页条数</label>
        <select id="f-page-size" class="form-select rounded-3 app-form-touch">
          <option value="10">每页 10 条</option>
          <option value="12" selected>每页 12 条</option>
          <option value="15">每页 15 条</option>
        </select>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-2 d-grid align-items-end">
        <button type="button" class="btn btn-primary rounded-3 app-touch-btn" onclick="eventsGoPage(1)">检索</button>
      </div>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-3 pt-3 border-top border-opacity-50">
      <button type="button" class="btn btn-sm btn-outline-success rounded-3" id="events-export-csv">导出 CSV（可用 Excel 打开）</button>
      <span class="text-muted small align-self-center">导出范围与上方筛选条件一致，最多 5000 条</span>
    </div>
  </div>
</div>

<div class="card card-soft border-0 shadow-sm overflow-hidden">
  <div class="card-body p-0">
    <div class="table-responsive events-table-wrap">
      <table class="table table-events table-hover align-middle mb-0 table-events-rwd">
        <thead class="table-events-thead">
          <tr>
            <th class="ps-md-4 th-id">编号</th>
            <th class="th-time">时间</th>
            <th class="th-loc">地点</th>
            <th class="th-type">类型</th>
            <th class="th-risk">等级</th>
            <th class="th-status">状态</th>
            <th class="pe-md-4 text-md-end th-actions">操作</th>
          </tr>
        </thead>
        <tbody id="events-body"></tbody>
      </table>
    </div>
    <div id="events-pagination" class="events-pagination px-3 py-3 border-top bg-white"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>window.PAGE_TYPE = "events";</script>
{% endblock %}
